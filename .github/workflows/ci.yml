name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: payment_db
          POSTGRES_USER: payment_user
          POSTGRES_PASSWORD: payment_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U payment_user -d payment_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USER: payment_user
      DB_PASSWORD: payment_password


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Create source schema
        run: |
          psql \
            -h 127.0.0.1 \
            -U payment_user \
            -d payment_db \
            -f sql/source/01_create_schemas.sql


      - name: Create source tables
        run: |
          psql \
            -h 127.0.0.1 \
            -U payment_user \
            -d payment_db \
            -f sql/source/02_create_source_tables.sql


      - name: Seed lookup tables
        run: |
          psql \
            -h 127.0.0.1 \
            -U payment_user \
            -d payment_db \
            -f sql/source/03_seed_lookup_data.sql


      - name: Create source indexes
        run: |
          psql \
            -h 127.0.0.1 \
            -U payment_user \
            -d payment_db \
            -f sql/source/04_create_source_indexes.sql


      - name: Create raw tables
        run: |
          psql \
            -h 127.0.0.1 \
            -U payment_user \
            -d payment_db \
            -f sql/raw/01_create_raw_tables.sql


      - name: Create staging tables
        run: |
          psql \
            -h 127.0.0.1 \
            -U payment_user \
            -d payment_db \
            -f sql/staging/01_create_staging_tables.sql


      - name: Create analytics tables
        run: |
          psql \
            -h 127.0.0.1 \
            -U payment_user \
            -d payment_db \
            -f sql/analytics/01_create_analytics_tables.sql


      - name: Create quarantine tables
        run: |
          psql \
            -h 127.0.0.1 \
            -U payment_user \
            -d payment_db \
            -f sql/quarantine/01_create_quarantine_tables.sql


      - name: Create monitoring tables
        run: |
          psql \
            -h 127.0.0.1 \
            -U payment_user \
            -d payment_db \
            -f sql/monitoring/01_create_pipeline_run_log.sql


      - name: Generate synthetic data
        run: |
          python src/ingestion/generate_transactions.py


      - name: Load source data
        run: |
          python src/ingestion/load_source_data.py


      - name: Extract source to raw
        run: |
          python src/ingestion/extract_source_to_raw.py


      - name: Quarantine invalid transactions
        run: |
          psql \
            -h 127.0.0.1 \
            -U payment_user \
            -d payment_db \
            -f sql/quarantine/02_quarantine_invalid_transactions.sql


      - name: Check quality threshold
        run: |
          python src/validation/check_quality_threshold.py


      - name: Load staging
        run: |
          psql \
            -h 127.0.0.1 \
            -U payment_user \
            -d payment_db \
            -f sql/staging/02_load_staging_tables.sql


      - name: Load dimensions
        run: |
          psql \
            -h 127.0.0.1 \
            -U payment_user \
            -d payment_db \
            -f sql/analytics/02_load_dimensions.sql


      - name: Load fact transactions
        run: |
          psql \
            -h 127.0.0.1 \
            -U payment_user \
            -d payment_db \
            -f sql/analytics/03_load_fact_transactions.sql


      - name: Run tests
        run: |
          pytest -v